name: venue-radar
on:
  schedule:
    - cron: "0 13 * * *"   # ~6am PT daily
  workflow_dispatch:
    inputs:
      summary:
        description: "Also email the current core list"
        required: false
        default: ""
permissions:
  contents: write
  issues: write
concurrency:
  group: venue-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run radar
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: harry_ila@berkeley.edu
          GH_TOKEN: ${{ github.token }}
          RADAR_SUMMARY: ${{ inputs.summary }}
        run: python venue_radar.py
      - name: Commit state
        run: |
          git config user.name "venue-radar[bot]"
          git config user.email "actions@github.com"
          git add state.json venues.md
          git diff --cached --quiet || git commit -m "radar: $(date -u +%F)"
          # profile.md edits can land mid-run; rebase our state commit onto them
          git pull --rebase --autostash origin main
          git push
      - name: Failure alert
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: harry_ila@berkeley.edu
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os
          from venue_radar import email_html, send_email
          url = os.environ["RUN_URL"]
          send_email(
              "🚨 Venue radar run failed",
              email_html(
                  "Radar run failed",
                  "Today's run errored before finishing. Nothing was committed, "
                  "so state is intact and tomorrow's run will self-heal — but if "
                  "this repeats, something needs fixing.",
                  [("What to check", "The run log linked below")],
                  url, "Open the failed run →",
                  "Repeated failures usually mean an expired token or secret."),
              f"Venue radar run failed: {url}")
          EOF
